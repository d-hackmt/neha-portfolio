<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Prajakta Biradar — Portfolio</title>
  <!-- Source for the PDF portfolio. Content comes from js/data.js.
       Rebuild: chrome --headless --no-pdf-header-footer --print-to-pdf=Prajakta-Biradar-Portfolio.pdf media-kit.html -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f4ee; --surface: #fdfbf8; --sand: #eee9e0; --ink: #141414; --ink-2: #2b2b2b;
      --muted: #6b6660; --line: #e2dcd2; --accent: #96764a; --accent-deep: #6f5532; --on-ink: #f2eee6;
      --display: "Cormorant Garamond", Georgia, serif;
      --body: "Inter", system-ui, sans-serif;
    }
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    html, body { margin: 0; background: #888; }
    body { font-family: var(--body); color: var(--ink); font-size: 9.5pt; line-height: 1.55; font-variant-numeric: lining-nums; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, p { margin: 0; }

    .page {
      position: relative; width: 210mm; height: 297mm; margin: 0 auto; overflow: hidden;
      background: var(--bg); padding: 16mm 16mm 14mm; display: flex; flex-direction: column;
      break-after: page;
    }
    .page:last-child { break-after: auto; }
    @media screen { .page { margin: 10mm auto; box-shadow: 0 10px 40px rgba(0,0,0,.25); } }

    .eyebrow { font-size: 7.5pt; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
    .h2 { font-family: var(--display); font-weight: 500; font-size: 26pt; line-height: 1.05; margin-top: 3mm; }
    .h2 em { font-style: normal; color: var(--accent); }
    .muted { color: var(--muted); }

    /* running footer */
    .foot {
      margin-top: auto; padding-top: 5mm; border-top: 1px solid var(--line);
      display: flex; justify-content: space-between; font-size: 7.5pt; color: var(--muted);
    }
    .foot a { color: var(--ink-2); }

    /* ---------- Cover ---------- */
    .cover { padding: 0; }
    .cover__top {
      background: var(--ink); color: var(--on-ink);
      padding: 18mm 16mm 16mm; display: flex; flex-direction: column; gap: 6mm; min-height: 138mm;
    }
    .cover__brand { display: flex; justify-content: space-between; align-items: center; font-size: 8pt; letter-spacing: .18em; text-transform: uppercase; color: rgba(242,238,230,.65); }
    .badge { display: inline-flex; align-items: center; gap: 2mm; padding: 1.4mm 3.4mm; border: 1px solid rgba(242,238,230,.25); border-radius: 99px; letter-spacing: .06em; text-transform: none; color: var(--on-ink); }
    .badge i { width: 2mm; height: 2mm; border-radius: 50%; background: #25d366; }
    .cover__name { font-family: var(--display); font-weight: 500; font-size: 54pt; line-height: .95; letter-spacing: -.01em; margin-top: auto; }
    .cover__role { font-size: 9pt; letter-spacing: .2em; text-transform: uppercase; color: #cdb48c; }
    .cover__tag { font-family: var(--display); font-size: 17pt; line-height: 1.3; max-width: 150mm; color: rgba(242,238,230,.9); }

    .cover__body { padding: 10mm 16mm 14mm; display: flex; flex-direction: column; flex: 1; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); padding-bottom: 7mm; }
    .stats div + div { border-left: 1px solid var(--line); padding-left: 5mm; }
    .stats dt { font-size: 7pt; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .stats dd { margin: 1.5mm 0 0; font-family: var(--display); font-size: 26pt; font-weight: 500; line-height: 1; }

    .about { display: grid; grid-template-columns: 1.25fr 1fr; gap: 10mm; padding-top: 8mm; }
    .about__bio p + p { margin-top: 2.5mm; }
    .about__bio { color: var(--ink-2); font-size: 9.5pt; margin-top: 3mm; }
    .chips { display: flex; flex-wrap: wrap; gap: 1.6mm; margin-top: 3mm; }
    .chip { padding: 1.2mm 3mm; border-radius: 99px; background: var(--sand); font-size: 7.8pt; font-weight: 500; color: var(--ink-2); }

    .contact { display: grid; grid-template-columns: 1fr 1.5fr 0.9fr 1fr; gap: 3mm; margin-top: 8mm; }
    .contact a {
      display: block; padding: 3.2mm 3.6mm; border: 1px solid var(--line); border-radius: 3mm; background: var(--surface);
    }
    .contact small { display: block; font-size: 6.8pt; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .contact strong { display: block; font-size: 8.4pt; font-weight: 600; margin-top: .6mm; white-space: nowrap; }

    /* ---------- Campaigns ---------- */
    .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10mm; margin-bottom: 7mm; }
    .head .muted { max-width: 70mm; text-align: right; font-size: 8.5pt; }
    .campaigns { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; }
    .camp {
      display: flex; flex-direction: column; gap: 2mm;
      padding: 4.6mm 5mm; background: var(--surface); border: 1px solid var(--line); border-radius: 3mm;
      break-inside: avoid;
    }
    .camp__top { display: flex; align-items: center; gap: 3mm; }
    .mark {
      flex: none; width: 11mm; height: 11mm; border-radius: 2.4mm; border: 1px solid var(--line); background: #fff;
      display: grid; place-items: center; overflow: hidden;
      font-family: var(--display); font-size: 12pt; font-weight: 500; color: var(--accent-deep);
    }
    .mark img { max-width: 80%; max-height: 70%; object-fit: contain; }
    .mark--dark { background: var(--ink); border-color: var(--ink); }
    .mark--fill img { width: 100%; height: 100%; max-width: none; max-height: none; object-fit: cover; }
    .mark.is-wide { width: 21mm; }
    .brand .mark.is-wide { width: 17mm; }
    .mark.is-wide img { max-width: 88%; max-height: 62%; }
    .camp__title { font-family: var(--display); font-size: 14pt; font-weight: 500; line-height: 1.1; }
    .camp__meta { font-size: 7pt; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-top: .5mm; }
    .camp__sum { color: var(--ink-2); font-size: 8.6pt; line-height: 1.5; }
    .camp__did { display: flex; flex-wrap: wrap; gap: 1.2mm; }
    .camp__did span { font-size: 7.2pt; padding: .7mm 2.2mm; border-radius: 99px; background: var(--sand); color: var(--ink-2); }
    .camp__links { display: flex; flex-wrap: wrap; gap: 1.5mm 4mm; margin-top: auto; padding-top: 1mm; }
    .camp__links a { font-size: 8pt; font-weight: 600; color: var(--ink); border-bottom: 1px solid var(--accent); }

    /* ---------- Brands + services ---------- */
    .brands { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.6mm; }
    .brand { display: flex; align-items: center; gap: 2.6mm; padding: 2.6mm; border: 1px solid var(--line); border-radius: 2.6mm; background: var(--surface); }
    .brand .mark { width: 10mm; height: 10mm; font-size: 11pt; }
    .brand b { display: block; font-size: 7.8pt; font-weight: 600; line-height: 1.25; }
    .brand span { display: block; font-size: 6.8pt; color: var(--muted); }

    .section + .section { margin-top: 9mm; }
    .services { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 6mm; margin-top: 5mm; }
    .service { padding: 3.6mm 0; border-top: 1px solid var(--line); }
    .service small { font-size: 7pt; color: var(--accent); letter-spacing: .1em; }
    .service h3 { font-family: var(--display); font-size: 13pt; font-weight: 500; margin: .8mm 0 .8mm; }
    .service p { font-size: 8pt; color: var(--muted); line-height: 1.45; }

    .process { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5mm; margin-top: 5mm; }
    .step { border-top: 1px solid var(--ink); padding-top: 3mm; }
    .step i { font-style: normal; display: inline-grid; place-items: center; width: 6.5mm; height: 6.5mm; border-radius: 50%; background: #e4dacb; font-family: var(--display); font-size: 10pt; }
    .step h3 { font-family: var(--display); font-size: 12.5pt; font-weight: 500; margin: 1.6mm 0 .6mm; }
    .step p { font-size: 7.8pt; color: var(--muted); line-height: 1.45; }

    .cta {
      margin-top: 9mm; padding: 7mm 8mm; border-radius: 4mm; background: var(--ink); color: var(--on-ink);
      display: flex; justify-content: space-between; align-items: center; gap: 8mm;
    }
    .cta h3 { font-family: var(--display); font-weight: 500; font-size: 20pt; line-height: 1.1; }
    .cta h3 em { font-style: normal; color: #cdb48c; }
    .cta p { font-size: 8.5pt; color: rgba(242,238,230,.7); margin-top: 1.5mm; }
    .cta__btns { display: flex; flex-direction: column; gap: 2mm; flex: none; }
    .cta__btns a { padding: 2.4mm 5mm; border-radius: 99px; font-size: 8.5pt; font-weight: 600; text-align: center; }
    .btn-wa { background: #25d366; color: #0b2b16; }
    .btn-line { border: 1px solid rgba(242,238,230,.35); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="js/data.js"></script>
  <script>
    (function () {
      "use strict";
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const SITE = "https://d-hackmt.github.io/neha-portfolio/";
      const P = PROFILE;
      const brandById = Object.fromEntries(BRANDS.map((b) => [b.id, b]));
      const initials = (name) =>
        name.split(/[\s–-]+/).filter((w) => /^[A-Za-z]/.test(w) && !/^(the|and|&)$/i.test(w)).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
      const mark = (b, fallback) =>
        b && b.logo
          ? `<span class="mark${b.logoDark ? " mark--dark" : ""}${b.logoFill ? " mark--fill" : ""}"><img src="${esc(b.logo)}" alt="" /></span>`
          : `<span class="mark">${esc(initials(b ? b.name : fallback))}</span>`;

      const wa = `https://wa.me/${P.whatsapp}?text=${encodeURIComponent(P.whatsappMessage)}`;
      const phone = P.whatsapp.replace(/^(\d{2})(\d{5})(\d+)$/, "+$1 $2 $3");
      const mail = `mailto:${P.email}?subject=${encodeURIComponent("Brand collaboration enquiry")}`;
      const footer = (n) => `
        <div class="foot">
          <span>${esc(P.fullName)} · ${esc(P.role)}</span>
          <span><a href="${SITE}">${SITE.replace("https://", "").replace(/\/$/, "")}</a> · ${n}</span>
        </div>`;

      /* Page 1 — cover */
      const cover = `
        <section class="page cover">
          <div class="cover__top">
            <div class="cover__brand"><span>Portfolio · ${new Date().getFullYear()}</span><span class="badge"><i></i>Open for collaborations</span></div>
            <h1 class="cover__name">${esc(P.fullName.split(" ")[0])}<br>${esc(P.fullName.split(" ").slice(1).join(" "))}</h1>
            <p class="cover__role">${esc(P.role)}</p>
            <p class="cover__tag">${esc(P.tagline)}</p>
          </div>
          <div class="cover__body">
            <dl class="stats">
              <div><dt>Years experience</dt><dd>${P.experienceYears}+</dd></div>
              <div><dt>Brands &amp; venues</dt><dd>${BRANDS.length}+</dd></div>
              <div><dt>Instagram followers</dt><dd>${P.instagram.followers.toLocaleString("en-IN")}</dd></div>
              <div><dt>Posts created</dt><dd>${P.instagram.posts}</dd></div>
            </dl>
            <div class="about">
              <div>
                <p class="eyebrow">About me</p>
                <div class="about__bio">${P.bio}</div>
              </div>
              <div>
                <p class="eyebrow">Key skills</p>
                <div class="chips">${P.skills.map((s) => `<span class="chip">${esc(s)}</span>`).join("")}</div>
                <p class="eyebrow" style="margin-top:5mm">Education &amp; base</p>
                <p style="margin-top:2mm">${esc(P.education)}<br><span class="muted">${esc(P.location)}</span></p>
              </div>
            </div>
            <div class="contact">
              <a href="${wa}"><small>WhatsApp</small><strong>${esc(phone)}</strong></a>
              <a href="${mail}"><small>Email</small><strong>${esc(P.email)}</strong></a>
              <a href="${esc(P.instagram.url)}"><small>Instagram</small><strong>${esc(P.instagram.handle)}</strong></a>
              <a href="${SITE}"><small>Website</small><strong>View full portfolio ↗</strong></a>
            </div>
            ${footer("01")}
          </div>
        </section>`;

      /* Page 2 — campaigns */
      const campaigns = `
        <section class="page">
          <div class="head">
            <div><p class="eyebrow">Selected collaborations</p><h2 class="h2">Campaigns, with <em>proof</em>.</h2></div>
            <p class="muted">Every link opens the original post on Instagram.</p>
          </div>
          <div class="campaigns">
            ${COLLABS.map((c) => {
              const b = brandById[c.brand];
              const title = c.title || (b ? b.name : "");
              return `
              <article class="camp">
                <div class="camp__top">
                  ${mark(b, title)}
                  <div><h3 class="camp__title">${esc(title)}</h3><p class="camp__meta">${esc(c.category)} · ${esc(c.type)}</p></div>
                </div>
                <p class="camp__sum">${esc(c.summary)}</p>
                <div class="camp__did">${c.did.map((d) => `<span>${esc(d)}</span>`).join("")}</div>
                <div class="camp__links">${c.links.map((l) => `<a href="${esc(l.url)}">${esc(l.label)} ↗</a>`).join("")}</div>
              </article>`;
            }).join("")}
          </div>
          ${footer("02")}
        </section>`;

      /* Page 3 — brands, services, process, contact */
      const more = `
        <section class="page">
          <div class="section">
            <p class="eyebrow">Brands I've worked with</p>
            <h2 class="h2" style="margin-bottom:5mm">Trusted by <em>${BRANDS.length}+</em> brands &amp; venues.</h2>
            <div class="brands">
              ${BRANDS.map((b) => {
                const inner = `${mark(b)}<span><b>${esc(b.name)}</b><span>${esc(b.work)}</span></span>`;
                return b.url ? `<a class="brand" href="${esc(b.url)}">${inner}</a>` : `<div class="brand">${inner}</div>`;
              }).join("")}
            </div>
          </div>

          <div class="section">
            <p class="eyebrow">What I offer</p>
            <div class="services">
              ${SERVICES.map((s, i) => `<div class="service"><small>${String(i + 1).padStart(2, "0")}</small><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>`).join("")}
            </div>
          </div>

          <div class="section">
            <p class="eyebrow">How we work</p>
            <div class="process">
              ${PROCESS.map((p, i) => `<div class="step"><i>${i + 1}</i><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p></div>`).join("")}
            </div>
          </div>

          <div class="cta">
            <div>
              <h3>Have a brand that deserves <em>attention</em>?</h3>
              <p>${esc(P.email)} · ${esc(phone)} · ${esc(P.instagram.handle)}</p>
            </div>
            <div class="cta__btns">
              <a class="btn-wa" href="${wa}">Chat on WhatsApp</a>
              <a class="btn-line" href="${mail}">Send an email</a>
            </div>
          </div>
          ${footer("03")}
        </section>`;

      document.getElementById("root").innerHTML = cover + campaigns + more;

      // Wide wordmarks get a wider tile so they stay legible
      document.querySelectorAll(".mark img").forEach((img) => {
        const check = () => img.naturalWidth / img.naturalHeight > 2.2 && img.parentElement.classList.add("is-wide");
        img.complete ? check() : img.addEventListener("load", check, { once: true });
      });
    })();
  </script>
</body>
</html>
